---
defaultGroups:
    - name: wheel
      must_exist: true
      system: true
    - name: audio
      must_exist: false
      system: true
    - name: video
      must_exist: false
      system: true
    - name: input
      must_exist: false
      system: true
    - name: storage
      must_exist: false
      system: true
    - name: network
      must_exist: false
      system: true
    - name: gamemode
      must_exist: false
      system: true

autologinGroup:            autologin
doAutologin:               false
sudoersGroup:              wheel
sudoersConfigureWithGroup: true
setRootPassword:           false
doReusePassword:           false

passwordRequirements:
    minLength: 4
    maxLength: -1
allowWeakPasswords:        true
allowWeakPasswordsDefault: true

userShell: /bin/bash

hostname:
    location:       EtcFile
    writeHostsFile: true
    template:       "${login}-gameros"
