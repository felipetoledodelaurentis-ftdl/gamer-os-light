<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#16123A"/>
      <stop offset="0.55" stop-color="#0A0B1C"/>
      <stop offset="1" stop-color="#04050B"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#00E5FF"/>
      <stop offset="0.7" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="petal2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hex" width="56" height="97" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
      <path d="M28 0 L56 16 L56 48.5 L28 64.5 L0 48.5 L0 16 Z M28 64.5 L28 97" fill="none" stroke="#3B3F7A" stroke-width="1" opacity="0.35"/>
    </pattern>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="hexmask"><rect width="1920" height="1080" fill="url(#fade)"/></mask>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#hex)" mask="url(#hexmask)"/>

  <!-- brilho de fundo -->
  <ellipse cx="960" cy="560" rx="520" ry="300" fill="#5B21B6" opacity="0.35" filter="url(#blur40)"/>
  <ellipse cx="760" cy="520" rx="300" ry="200" fill="#0891B2" opacity="0.35" filter="url(#blur40)"/>

  <!-- hexagonos neon concentricos -->
  <g transform="translate(960 500)" fill="none" stroke-linejoin="round">
    <path d="M0 -330 L286 -165 L286 165 L0 330 L-286 165 L-286 -165 Z" stroke="#8B5CF6" stroke-width="2" opacity="0.25"/>
    <path d="M0 -270 L234 -135 L234 135 L0 270 L-234 135 L-234 -135 Z" stroke="#00E5FF" stroke-width="2" opacity="0.35"/>
    <path d="M0 -210 L182 -105 L182 105 L0 210 L-182 105 L-182 -105 Z" fill="#0B0E1A" fill-opacity="0.85" stroke="url(#petal)" stroke-width="10" filter="url(#glow)"/>
    <path d="M58 -66 A88 88 0 1 0 78 14 L8 14" stroke="url(#petal)" stroke-width="30" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M-48 -34 L-8 -6 L-48 22 Z" fill="#FFFFFF" opacity="0.92"/>
  </g>

  <!-- linhas neon -->
  <path d="M0 800 C 400 700 700 900 960 820 S 1500 700 1920 780" fill="none" stroke="url(#neon)" stroke-width="3" filter="url(#glow)"/>
  <path d="M0 860 C 420 780 760 960 1000 880 S 1520 780 1920 850" fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
  <path d="M0 920 C 460 860 800 1000 1040 940 S 1560 860 1920 920" fill="none" stroke="url(#neon)" stroke-width="1.5" opacity="0.35"/>

  <!-- nome -->
  <text x="960" y="1010" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="30"
        font-weight="700" letter-spacing="14" fill="#E5E7FF" opacity="0.55">GAMER OS LIGHT</text>
</svg>
