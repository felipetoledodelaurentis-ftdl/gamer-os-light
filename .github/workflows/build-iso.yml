name: Gerar ISO do Gamer OS Light

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Liberar espaco em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force
          df -h /

      - name: Gerar a ISO dentro de um container Arch Linux
        run: |
          sudo docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/build" \
            archlinux:latest \
            bash /build/scripts/build-iso.sh

      - name: Conferir resultado
        run: ls -lh out/

      - name: Disponibilizar a ISO para download
        uses: actions/upload-artifact@v4
        with:
          name: gamer-os-light-iso
          path: |
            out/*.iso
            out/*.sha256
          compression-level: 0
          retention-days: 30
